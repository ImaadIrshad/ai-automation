# Continuous Integration: runs automatically on GitHub for every push / PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest  # GitHub spins up a fresh Linux machine
    steps:
      # 1. Get the code onto the runner.
      - uses: actions/checkout@v4

      # 2. Install the Python version the project targets.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Install the project's dependencies.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Lint: fails the check (non-zero exit) on any PEP 8 / style issue.
      - name: Lint with ruff
        run: ruff check .

      # 5. Type-check (PEP 484): fails on any type inconsistency.
      - name: Type-check with mypy
        run: mypy app crs data

      # 6. Run the test suite — fails the check if any test fails.
      - name: Run tests
        run: pytest -q
