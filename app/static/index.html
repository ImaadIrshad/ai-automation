<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movie CRS</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e222b;
      --text: #e6e8ee;
      --muted: #9aa3b2;
      --accent: #6c8cff;
      --user: #2a3350;
      --border: #262b36;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f6;
        --text: #1a1d24; --muted: #5b6472; --accent: #3b5bfd;
        --user: #dfe6ff; --border: #e3e6ec;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; min-height: 100vh;
    }
    .app {
      width: 100%; max-width: 720px; display: flex; flex-direction: column;
      height: 100vh; padding: 16px;
    }
    header { padding: 8px 4px 16px; }
    h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .badge {
      display: inline-block; font-size: 12px; color: var(--accent);
      background: var(--panel-2); border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 999px; margin-left: 6px;
    }
    #log {
      flex: 1; overflow-y: auto; background: var(--panel);
      border: 1px solid var(--border); border-radius: 12px; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--panel-2); border-bottom-left-radius: 4px; }
    .msg.bot .cursor { color: var(--accent); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .hint { color: var(--muted); font-size: 13px; text-align: center; margin: auto 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
    .chip {
      font-size: 13px; color: var(--muted); background: var(--panel-2);
      border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px;
      cursor: pointer;
    }
    .chip:hover { color: var(--text); border-color: var(--accent); }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input[type=text] {
      flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); font-size: 15px;
    }
    input[type=text]:focus { outline: none; border-color: var(--accent); }
    button {
      padding: 12px 18px; border-radius: 10px; border: none; background: var(--accent);
      color: white; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🎬 Movie CRS <span class="badge" id="badge">…</span></h1>
      <div class="sub">A conversational movie recommender — ask for something and watch the reply stream in.</div>
    </header>

    <div id="log">
      <div class="hint" id="hint">Ask for a movie recommendation to get started.</div>
    </div>

    <div class="chips" id="chips">
      <span class="chip">A mind-bending sci-fi about dreams</span>
      <span class="chip">Something like The Godfather, but not superheroes</span>
      <span class="chip">A heartwarming film, nothing too dark</span>
    </div>

    <form id="form">
      <input type="text" id="input" placeholder="e.g. recommend a gripping crime drama" autocomplete="off" />
      <button type="submit" id="send">Send</button>
    </form>
  </div>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const hint = document.getElementById("hint");

    // Conversation state sent back to the server so it has full context.
    const history = [];

    // Show which CRS approach is running so a demo makes the active model clear.
    fetch("/config").then(r => r.json()).then(cfg => {
      document.getElementById("badge").textContent = cfg.approach;
    }).catch(() => { document.getElementById("badge").textContent = "offline"; });

    document.getElementById("chips").addEventListener("click", (e) => {
      if (e.target.classList.contains("chip")) {
        input.value = e.target.textContent;
        input.focus();
      }
    });

    function addMessage(role, text) {
      if (hint) hint.remove();
      const el = document.createElement("div");
      el.className = "msg " + (role === "user" ? "user" : "bot");
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      // Snapshot history BEFORE adding the current question (it's sent separately).
      const priorHistory = history.slice();
      addMessage("user", question);
      history.push({ role: "user", content: question });
      input.value = "";
      setBusy(true);

      const botEl = addMessage("bot", "");
      botEl.innerHTML = '<span class="cursor">▋</span>';

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, history: priorHistory }),
        });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let acc = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          acc += decoder.decode(value, { stream: true });
          botEl.textContent = acc;           // live streaming update
          log.scrollTop = log.scrollHeight;
        }
        history.push({ role: "assistant", content: acc });
      } catch (err) {
        botEl.textContent = "⚠️ Something went wrong reaching the server.";
      } finally {
        setBusy(false);
      }
    });

    function setBusy(busy) {
      sendBtn.disabled = busy;
      input.disabled = busy;
      if (!busy) input.focus();
    }
  </script>
</body>
</html>
