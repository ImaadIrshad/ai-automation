<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movie CRS</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #141922;
      --panel-2: #1b2130;
      --text: #e8eaf0;
      --muted: #8b94a7;
      --accent: #7c8cff;
      --accent-2: #a06bff;
      --border: #232a38;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6fb; --panel: #ffffff; --panel-2: #eef1f7;
        --text: #141821; --muted: #5b6474; --accent: #4b63f5; --accent-2: #8b5cf6;
        --border: #e4e8f0; --shadow: 0 10px 30px rgba(20, 30, 60, 0.08);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background:
        radial-gradient(1200px 500px at 50% -10%, rgba(124, 140, 255, 0.14), transparent 70%),
        var(--bg);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
      display: flex; justify-content: center;
    }
    .app {
      width: 100%; max-width: 760px; height: 100vh;
      display: flex; flex-direction: column; padding: 20px 16px;
    }

    /* Header */
    header { display: flex; align-items: center; gap: 12px; padding: 4px 4px 18px; }
    .logo {
      width: 40px; height: 40px; flex: none; border-radius: 12px; font-size: 20px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 6px 16px rgba(124, 140, 255, 0.35);
    }
    h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: -0.2px;
         display: flex; align-items: center; gap: 8px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .badge {
      font-size: 11px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase;
      color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      padding: 2px 8px; border-radius: 999px;
    }

    /* Chat log */
    #log {
      flex: 1; overflow-y: auto; background: var(--panel);
      border: 1px solid var(--border); border-radius: 18px; padding: 18px;
      display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow);
    }
    .row { display: flex; align-items: flex-end; gap: 10px; animation: rise 0.28s ease both; }
    .row.user { flex-direction: row-reverse; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    .avatar {
      width: 30px; height: 30px; flex: none; border-radius: 50%; font-size: 15px;
      display: grid; place-items: center; background: var(--panel-2);
      border: 1px solid var(--border);
    }
    .bubble {
      max-width: 78%; padding: 11px 15px; border-radius: 16px; white-space: pre-wrap;
      word-wrap: break-word; box-shadow: var(--shadow);
    }
    .row.bot .bubble { background: var(--panel-2); border: 1px solid var(--border);
                       border-bottom-left-radius: 5px; }
    .row.user .bubble {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border-bottom-right-radius: 5px;
    }
    .bubble strong { font-weight: 700; }
    .cursor { color: var(--accent); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Typing indicator */
    .typing { display: inline-flex; gap: 4px; padding: 2px 0; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
                        30% { transform: translateY(-5px); opacity: 1; } }

    /* Empty state */
    .hint { margin: auto; text-align: center; color: var(--muted); }
    .hint .big { font-size: 34px; }
    .hint .big + div { margin-top: 8px; font-size: 14px; }

    /* Example chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 2px 0; }
    .chip {
      font-size: 13px; color: var(--muted); background: var(--panel);
      border: 1px solid var(--border); border-radius: 999px; padding: 7px 13px;
      cursor: pointer; transition: all 0.15s;
    }
    .chip:hover { color: var(--text); border-color: var(--accent);
                  background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }

    /* Input bar */
    form { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
    .field {
      flex: 1; display: flex; align-items: center; background: var(--panel);
      border: 1px solid var(--border); border-radius: 999px; padding: 4px 6px 4px 18px;
      box-shadow: var(--shadow); transition: border-color 0.15s;
    }
    .field:focus-within { border-color: var(--accent); }
    input[type=text] {
      flex: 1; border: none; outline: none; background: transparent;
      color: var(--text); font-size: 15px; padding: 10px 0;
    }
    input[type=text]::placeholder { color: var(--muted); }
    #send {
      width: 40px; height: 40px; flex: none; border: none; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; font-size: 17px; cursor: pointer; display: grid; place-items: center;
      transition: transform 0.12s, opacity 0.15s;
    }
    #send:hover:not(:disabled) { transform: scale(1.06); }
    #send:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">🎬</div>
      <div>
        <h1>Movie CRS <span class="badge" id="badge">…</span></h1>
        <div class="sub">A conversational movie recommender — replies stream in live.</div>
      </div>
    </header>

    <div id="log">
      <div class="hint" id="hint">
        <div class="big">🍿</div>
        <div>Ask for a movie recommendation to get started.</div>
      </div>
    </div>

    <div class="chips" id="chips">
      <span class="chip">A mind-bending sci-fi about dreams</span>
      <span class="chip">Something like The Godfather, but not superheroes</span>
      <span class="chip">A heartwarming film, nothing too dark</span>
    </div>

    <form id="form">
      <div class="field">
        <input type="text" id="input" placeholder="Ask for a movie…" autocomplete="off" />
      </div>
      <button type="submit" id="send" aria-label="Send">↑</button>
    </form>
  </div>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    let hint = document.getElementById("hint");

    // Conversation state sent back to the server so it has full context.
    const history = [];

    // Show which CRS approach is running so a demo makes the active model clear.
    fetch("/config").then(r => r.json()).then(cfg => {
      document.getElementById("badge").textContent = cfg.approach;
    }).catch(() => { document.getElementById("badge").textContent = "offline"; });

    document.getElementById("chips").addEventListener("click", (e) => {
      if (e.target.classList.contains("chip")) {
        input.value = e.target.textContent;
        input.focus();
      }
    });

    // Build a message row (bot rows get an avatar); returns the bubble element.
    function addMessage(role) {
      if (hint) { hint.remove(); hint = null; }
      const row = document.createElement("div");
      row.className = "row " + role;
      if (role === "bot") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "🎬";
        row.appendChild(avatar);
      }
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      row.appendChild(bubble);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
      return bubble;
    }

    // Render a reply safely: escape HTML, turn **bold** into real bold, and
    // strip any stray Markdown (tables, headings, loose asterisks) so replies
    // read as clean prose even if the model over-formats.
    function renderReply(text) {
      let s = text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      s = s.replace(/^\s*\|.*$/gm, "")            // markdown table rows
           .replace(/^\s*[-|:]{3,}\s*$/gm, "")     // table separators / rules
           .replace(/^#{1,6}\s*/gm, "");           // headings
      s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); // bold
      s = s.replace(/(^|\s)\*+(\S)/g, "$1$2").replace(/\*/g, ""); // loose asterisks
      return s.replace(/\n{3,}/g, "\n\n").trim();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      // Snapshot history BEFORE adding the current question (it's sent separately).
      const priorHistory = history.slice();
      const userEl = addMessage("user");
      userEl.textContent = question;
      history.push({ role: "user", content: question });
      input.value = "";
      setBusy(true);

      const botEl = addMessage("bot");
      botEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, history: priorHistory }),
        });

        // Decouple display from the network. The server can deliver tokens in
        // big, fast bursts, so we buffer them and reveal characters at a smooth,
        // steady pace — a graceful typewriter rather than sudden jumps. It still
        // catches up quickly (reveals more when further behind), so it's not slow.
        let received = "";
        let shown = 0;
        let streaming = true;

        const typewriter = new Promise((resolve) => {
          function paint() {
            const remaining = received.length - shown;
            if (remaining > 0) {
              shown += Math.min(8, Math.max(2, Math.ceil(remaining / 12)));
              if (shown > received.length) shown = received.length;
              const cursor = (streaming || shown < received.length)
                ? '<span class="cursor">▋</span>' : '';
              botEl.innerHTML = renderReply(received.slice(0, shown)) + cursor;
              log.scrollTop = log.scrollHeight;
            }
            if (streaming || shown < received.length) {
              requestAnimationFrame(paint);
            } else {
              botEl.innerHTML = renderReply(received);  // final, cursor removed
              resolve();
            }
          }
          requestAnimationFrame(paint);
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += decoder.decode(value, { stream: true });
        }
        streaming = false;        // let the typewriter reveal any buffered tail
        await typewriter;
        history.push({ role: "assistant", content: received });
      } catch (err) {
        botEl.textContent = "⚠️ Something went wrong reaching the server.";
      } finally {
        setBusy(false);
      }
    });

    function setBusy(busy) {
      sendBtn.disabled = busy;
      input.disabled = busy;
      if (!busy) input.focus();
    }
  </script>
</body>
</html>
