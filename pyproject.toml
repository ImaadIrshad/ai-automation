[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# pycodestyle (E), pyflakes (F), isort (I), pyupgrade (UP), bugbear (B).
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
# faiss / sentence_transformers ship no type stubs — don't fail on their imports.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
# Silence the pytest-asyncio default-loop-scope warning by pinning it.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
